name: Android CI

on:
  push:
    branches: [ main, 'fix/ghost-live-backpressure-log-export' ]
    paths-ignore:
      - "**.md"
      - ".idea/**"
      - ".gitignore"
      - ".gitmodules"

  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Check lint
      run: ./gradlew lintFdroidDebug lintGoogleDebug

    - name: Build debug artifacts
      run: ./gradlew assembleDebug

    - name: Run local tests
      run: ./gradlew testFdroidDebug testGoogleDebug

    - name: Upload build reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: app/build/reports
        retention-days: 30

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compare Detekt against main baseline
        shell: bash
        run: |
          set +e
          set -uo pipefail
          ./gradlew detekt --console=plain > /tmp/detekt-branch.log 2>&1
          branch_rc=$?
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/darkmesh-main FETCH_HEAD
          git -C /tmp/darkmesh-main submodule update --init --recursive
          (
            cd /tmp/darkmesh-main
            ./gradlew detekt --console=plain > /tmp/detekt-main.log 2>&1
          )
          main_rc=$?
          echo "Branch detekt exit: $branch_rc"
          echo "Main detekt exit: $main_rc"
          grep -E 'Analysis failed with|BUILD SUCCESSFUL' /tmp/detekt-branch.log | tail -3 || true
          grep -E 'Analysis failed with|BUILD SUCCESSFUL' /tmp/detekt-main.log | tail -3 || true
          echo "Branch Detekt summary:"
          tail -n 12 /tmp/detekt-branch.log
          echo "Main Detekt summary:"
          tail -n 12 /tmp/detekt-main.log
          if [ "$branch_rc" -eq 0 ]; then exit 0; fi
          if [ "$main_rc" -ne 0 ]; then
            echo "::error::Both main and branch fail Detekt; inspect report artifacts to separate existing issues."
          fi
          exit "$branch_rc"

      - name: Upload Detekt comparison logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-main-comparison
          path: /tmp/detekt-*.log
          retention-days: 7

      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports
          retention-days: 30

  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - uses: reactivecircus/android-emulator-runner@v2
        env:
            ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          script: ./gradlew connectedFdroidDebugAndroidTest
